<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Voice</title>
<link rel="stylesheet" href="app.css?v=f0c7c5b82f">
</head>
<body>
<div id="app" hidden>
  <header id="bar">
    <button id="agent" class="chip" aria-label="Choose agent"><span id="agent-name">…</span><svg viewBox="0 0 24 24" class="i"><path d="M6 9l6 6 6-6"/></svg><b id="agent-unread" hidden></b></button>
    <span class="grow"></span>
    <button id="conn" class="chip quiet" aria-label="Connection and debug"><i id="conn-dot"></i><span id="conn-text"></span></button>
    <button id="settings" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <main id="feed" aria-label="Conversation"></main>
  <button id="jump" hidden>Jump to playing</button>
  <div id="net" hidden>No connection. Messages and audio will resume by themselves.</div>
  <div id="banner" hidden></div>
  <footer id="dock">
    <div id="transport">
      <button id="prev" class="icon" aria-label="Previous message"><svg viewBox="0 0 24 24" class="i"><path d="M6 5v14M19 5L9 12l10 7z"/></svg></button>
      <button id="play" class="icon big" aria-label="Play"><svg viewBox="0 0 24 24" class="i play"><path d="M8 5l11 7-11 7z"/></svg><svg viewBox="0 0 24 24" class="i pause"><path d="M8 5v14M16 5v14"/></svg><span class="spin"></span></button>
      <button id="next" class="icon" aria-label="Next message"><svg viewBox="0 0 24 24" class="i"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
      <span class="grow"></span>
      <button id="slower" class="icon sm" aria-label="Slower">−</button>
      <span id="rate">1.0×</span>
      <button id="faster" class="icon sm" aria-label="Faster">+</button>
      <button id="auto" class="chip" aria-pressed="true">Auto</button>
    </div>
    <form id="composer" autocomplete="off">
      <div id="field">
        <textarea id="draft" rows="1" placeholder="Message" enterkeyhint="send" aria-label="Message"></textarea>
        <canvas id="level" width="120" height="24" hidden></canvas>
      </div>
      <button type="button" id="cancel-rec" class="icon" aria-label="Discard recording" hidden><svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button type="button" id="listen" class="icon round" data-state="off" aria-label="Voice control: off"><svg viewBox="0 0 24 24" class="i"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4"/></svg><span id="listen-label"></span></button>
      <button type="button" id="mic" class="icon round" aria-label="Dictate"><svg viewBox="0 0 24 24" class="i mic"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><svg viewBox="0 0 24 24" class="i done"><path d="M5 13l4 4L19 7"/></svg></button>
      <button type="submit" id="send" class="icon round accent" aria-label="Send" disabled><svg viewBox="0 0 24 24" class="i"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </footer>
  <div id="toast" hidden></div>
</div>

<dialog id="picker" aria-label="Choose agent"><div class="sheet">
  <div class="sheet-head"><input id="search" type="search" placeholder="Search agents" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="close icon" data-close aria-label="Close"><svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ul id="topics"></ul>
</div></dialog>

<dialog id="settings-sheet" aria-label="Settings"><div class="sheet">
  <div class="sheet-head"><h2>Settings</h2><button class="close icon" data-close aria-label="Close"><svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <section>
    <label class="row"><span>Autoplay new messages</span><input id="set-auto" type="checkbox"></label>
    <label class="row"><span>Voice control (say pause, next, back, send; to finish and resume say the phrase below)</span><input id="set-voice" type="checkbox"></label>
    <label class="row"><span>End phrase (default: over)</span><input id="set-phrase" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" style="flex:1;max-width:55%;font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit"></label>
    <label class="row"><span>Start word (default: pause)</span><input id="set-start" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" style="flex:1;max-width:55%;font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit"></label>
    <label class="row"><span>Long silence finishes a reply (seconds, 0 = off)</span><input id="set-silence" type="number" min="0" max="30" step="1" style="width:70px;font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit"></label>
    <label class="row"><span>Hide attachments</span><input id="set-hide-att" type="checkbox"></label>
    <label class="row"><span>Speed <b id="set-rate-text"></b></span><input id="set-rate" type="range" min="0.5" max="3" step="0.1"></label>
  </section>
  <section>
    <button id="open-debug" class="wide">Connection and debug log</button>
    <button id="reload" class="wide">Reload app</button>
  </section>
  <section>
    <p class="muted" id="account-text"></p>
    <button id="sign-out" class="wide danger">Sign out…</button>
  </section>
</div></dialog>

<dialog id="debug-sheet" aria-label="Debug"><div class="sheet full">
  <div class="sheet-head"><h2>Debug</h2><button class="close icon" data-close aria-label="Close"><svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <pre id="debug-status"></pre>
  <div class="debug-actions"><button id="dbg-copy">Copy all</button><button id="dbg-send">Send to server</button><button id="dbg-ping">Test voice</button><button id="dbg-kick">Reconnect</button><button id="dbg-clear">Clear</button><button onclick="location.href='test.html'">Self-test</button></div>
  <pre id="debug-log"></pre>
</div></dialog>

<dialog id="login" aria-label="Sign in"><form class="sheet" id="login-form">
  <h2>Voice</h2>
  <a id="howto" href="https://github.com/SichangHe/agent_manager/tree/main/zulip-voice#readme" target="_blank" rel="noopener">New here? How to use this</a>
  <p class="muted">Paste your zuliprc once. The key stays in this browser.</p>
  <textarea name="zuliprc" rows="6" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="[api]&#10;email=…&#10;key=…&#10;site=https://…"></textarea>
  <p id="login-error" class="error" role="status"></p>
  <button class="wide accent">Connect</button>
</form></dialog>

<script type="module" src="app.mjs?v=f0c7c5b82f"></script>
</body>
</html>

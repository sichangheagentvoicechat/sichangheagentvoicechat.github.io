<html lang="en">

<style>
:root{font:18px system-ui;color:#162b37;background:#edf3f5}body{max-width:740px;margin:auto;padding:20px}header{position:sticky;top:0;background:#edf3f5;padding:12px 0}h1{font-size:1.6rem;margin:0}label{display:block;margin:16px 0 6px}button,select,textarea{font:inherit;border:1px solid #90a5af;border-radius:12px;padding:14px}button{background:white;cursor:pointer;min-height:52px}button.primary{background:#135b66;color:white}button:disabled{opacity:.45;cursor:default}select,textarea{width:100%;box-sizing:border-box}textarea{min-height:130px}section{background:white;border-radius:18px;padding:18px;margin-top:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.note{font-size:.9rem;color:#46606e}#status{min-height:2.7em}article{border-bottom:1px solid #dae4e8;padding:12px 0;white-space:pre-wrap}article:last-child{border:0}#mode{color:#905400}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #10898c;outline-offset:3px}
*{box-sizing:border-box}body{margin:0;padding:4px;height:100vh;height:100dvh;max-width:none;display:flex;flex-direction:column;gap:4px;font-size:16px}header{position:static;padding:0}h1{font-size:17px}#mode{font-size:12px;margin:0}label{margin:2px 0}button,select,textarea{padding:6px;border-radius:6px}button{min-height:42px}main{display:flex;flex-direction:column;flex:1;min-height:0;gap:4px}section{padding:4px;margin:0;border-radius:6px}section:first-child{display:flex;flex-direction:column;flex:1;min-height:0}#messages{overflow:auto;flex:1;min-height:30px}textarea{min-height:64px;height:64px;max-height:20dvh}.actions{gap:4px;margin-top:2px}#status{min-height:18px;max-height:46px;overflow:auto;font-size:13px;margin:3px 0}.note{font-size:12px;margin:0}article{padding:5px 0}#choose{display:none}button[aria-pressed=true]{background:#135b66;color:white}

<link rel="stylesheet" href="./reader-ui.css">
<header><h1>Voice</h1><p id="mode">Mock conversations · nothing goes to Zulip</p><label for="agent">Talking to</label><select id="agent"></select><div class="actions"><button id="choose">Choose agent by voice</button></div></header>
<main>
<section><div class="actions"><button id="auto" aria-pressed="false">Auto-play: off</button><button id="listen">Read replies</button><button id="quiet">Stop audio</button></div><div id="messages" aria-label="Conversation"></div></section>
<section><label for="draft">Your message</label><textarea id="draft" placeholder="Tap Dictate, or use your keyboard microphone."></textarea><div class="actions"><button id="dictate" class="primary">Dictate</button><button id="stop" disabled>Finish dictating</button><button id="review">Review aloud</button><button id="send">Send mock message</button></div><p id="status" role="status" aria-live="polite">Choose an agent, then dictate a draft.</p><p class="note">Voice confirmation: after review, say “send” or “cancel”. Keep the page open. Your browser may use an online speech service.</p></section>
</main>
<script type="module">
import "./static-bootstrap.mjs";
import {createReader,splitSentences,installCompactControls} from './reader-ui.mjs';
import {createAudio} from './browser-audio.mjs';
import {createHandsfree} from './handsfree.mjs';
import {resilientFetch,openDurableQueue} from './resilient-fetch.mjs';
const el = Object.fromEntries(['agent','choose','messages','draft','status','dictate','stop','review','send','listen','quiet'].map(id=>[id,document.getElementById(id)]));
const Recognition = window.isSecureContext && navigator.mediaDevices?.getUserMedia && window.MediaRecorder;
const submissionId=()=>Array.from(crypto.getRandomValues(new Uint8Array(18)),byte=>byte.toString(16).padStart(2,'0')).join('');
let generation=0, busy=false, pending=null, conversations=[], messages=[], recording=false, loaded=false, loading=false, drafts={}, mock=true, ready=false;
const status = text=>{el.status.textContent=text;};
let outbox=null,storageScope='pending',flushing=false,audioDraft=null;
const activeRecordings=new Set();
let dictationClips=[];
let finishingSend=false,captureReady=false;
const finishSend=document.createElement('button');finishSend.textContent='Finish & send';finishSend.id='finish-send';finishSend.disabled=true;el.stop.after(finishSend);
const appliedRecordings=new Set();
const connection=document.createElement('span');connection.id='connection';connection.style.fontSize='12px';document.querySelector('header').append(connection);
const networkState=({state})=>{connection.textContent=state==='connected'?'':state==='retrying'?'Reconnecting…':'Offline · drafts kept';};
const clipList=document.createElement('div');document.getElementById('draft').after(clipList);
const audio=createAudio({status,clipsChanged:clips=>{dictationClips=clips;clipList.replaceChildren(...clips.map((clip,index)=>{const row=document.createElement('div');row.textContent='Recording '+(index+1)+': '+clip.state;if(clip.error){row.textContent+=' · '+clip.error;const retry=document.createElement('button');retry.textContent='Retry';retry.onclick=()=>audio.retryClip(clip.id);row.append(retry);}return row;}));},transcribe:async(blob,signal,meta)=>{
  const id=meta.id;
  activeRecordings.add(id);
  try{
  if(!outbox)throw new Error('Offline storage unavailable. Recording cannot be saved.');
  const existing=await outbox.get(id);if(!existing.data){const saved=await outbox.add({id,kind:'audio',agent:meta.agent,blob,prefix:meta.prefix,confirmation:meta.confirm});if(saved.error)throw new Error(saved.error);}
  const result=await resilientFetch('/api/stt',{method:'POST',body:blob,signal},{retries:0,timeoutMs:10000,onState:networkState});
  if(result.error)throw new Error(result.error);const data=await result.response.json();if(!result.response.ok)throw new Error(data.error);
  return {text:data.text,id};
  }finally{activeRecordings.delete(id);}
}});let speaking=false;
window.startVoicePreload?.(data=>audio.cachePrepared(data)).catch(()=>status('Voice preloading disconnected; retrying in the background.'));
const speed=document.createElement('span'),slower=document.createElement('button'),faster=document.createElement('button');
slower.textContent='−';faster.textContent='+';slower.setAttribute('aria-label','Slower playback');faster.setAttribute('aria-label','Faster playback');
function showSpeed(){speed.textContent=audio.getRate().toFixed(1)+'×';slower.disabled=audio.getRate()<=0.5;faster.disabled=audio.getRate()>=3;}
slower.onclick=()=>{audio.setRate(audio.getRate()-0.1);showSpeed();};faster.onclick=()=>{audio.setRate(audio.getRate()+0.1);showSpeed();};showSpeed();document.querySelector('section:first-child .actions').append(slower,speed,faster);
document.addEventListener('click',()=>audio.unlock());
let resumeReading=null,responseAgent=null,readingPosition=null,promptDone=null;
let pausedPosition=null,compactControls;
const pauseButton=document.createElement('button');pauseButton.id='pause';pauseButton.textContent='Play';pauseButton.className='primary';document.querySelector('section:first-child .actions').append(pauseButton);
function rememberPosition(position){pausedPosition=position;try{if(position)localStorage.setItem('voice-position:'+storageScope,JSON.stringify(position));else localStorage.removeItem('voice-position:'+storageScope);}catch{status('Playback position could not be saved.');}}
pauseButton.onclick=async()=>{
  if(busy)return;
  if(pauseButton.textContent==='Pause'){
    if(readingPosition)rememberPosition({agent:el.agent.value,id:readingPosition.message.id,index:readingPosition.index,completeRead:readingPosition.completeRead});
    if(!pausedPosition){status('Start reading a message first.');return;}
    autoplay=false;handsfree.stop();cancelAudio();autoButton.textContent='Auto-play: off';autoButton.setAttribute('aria-pressed','false');pauseButton.textContent='Play';return;
  }
  pauseButton.disabled=true;
  try{
    if(recording)return;
    const saved=pausedPosition;if(!saved){if(!autoplay)autoButton.click();return;}
    if(saved.agent!==el.agent.value){status('Return to '+saved.agent+' to resume this message.');return;}
    await load(saved.id);const message=messages.find(m=>m.id===saved.id);if(!message){status('Saved message could not be loaded.');return;}
    cancelAudio();autoplay=true;autoButton.textContent='Auto-play: on';autoButton.setAttribute('aria-pressed','true');pauseButton.textContent='Pause';compactControls?.open(false);audio.unlock();
    autoplaySpeaking=true;
    readMessage(message,saved.index,()=>{autoplaySpeaking=false;queueUnread().then(playQueued);},()=>{autoplaySpeaking=false;},saved.completeRead);
  }finally{pauseButton.disabled=false;}
};
const listeningState=document.createElement('span');listeningState.setAttribute('role','status');document.querySelector('header').append(listeningState);
const handsfree=createHandsfree({
  getContext:()=>({agent:el.agent.value}),
  onRecording:async(blob,meta)=>{if(!outbox)throw new Error('Offline storage unavailable.');const id=submissionId();const result=await outbox.add({id,kind:'audio',agent:meta.context.agent,blob,handsfree:true,prefix:meta.draft||'',command:meta.state==='listening'});if(result.error)throw new Error(result.error);return id;},
  onTranscribed:async id=>{if(id)await outbox.remove(id);},
  onState:state=>{listeningState.textContent=state==='off'?'':state==='listening'?'Listening for “pause”':state;if(state==='off'&&autoplay){autoplay=false;autoButton.textContent='Auto-play: off';autoButton.setAttribute('aria-pressed','false');cancelAudio();}},
  onError:status,
  onDraft:(text,id)=>{const previous=drafts[el.agent.value],oldText=el.draft.value,oldPending=pending;el.draft.value=text;pending=null;if(id)appliedRecordings.add(id);if(!saveDraft()){drafts[el.agent.value]=previous;el.draft.value=oldText;pending=oldPending;if(id)appliedRecordings.delete(id);throw new Error('Draft storage unavailable. Recording retained.');}controls();},
  onPause:async()=>{responseAgent=el.agent.value;resumeReading=readingPosition?{...readingPosition,index:Math.max(0,readingPosition.index-(audio.elapsed()<1?1:0))}:null;audio.pause();await new Promise((resolve,reject)=>{promptDone=resolve;audio.speak('Paused. Give your response. Say resume autoplay when finished.',()=>{promptDone=null;resolve();},()=>{promptDone=null;reject(new Error('Could not play the response prompt.'));});});},
  onReply:async text=>{const token=generation;if(responseAgent!==el.agent.value)return false;if(text&&!await send(true))return false;if(token!==generation||handsfree.state!=='sending')return false;if(resumeReading){const r=resumeReading;readMessage(r.message,r.index,r.done,r.failed,r.completeRead);}else{speaking=false;autoplaySpeaking=false;playQueued();}return true;}
});
const cancelQueued=document.createElement('button');cancelQueued.textContent='Stop retries; edit draft';el.send.after(cancelQueued);
cancelQueued.onclick=async()=>{if(busy||!pending)return;busy=true;controls();const result=await outbox?.remove(pending.id);busy=false;if(!result||result.error){status(result?.error||'Cannot cancel saved submission.');controls();return;}pending=null;saveDraft();controls();status('Retries stopped. If delivery was uncertain, check Zulip before sending an edited version.');};
const composer=document.querySelector('section:last-child');
composer.prepend(document.querySelector('section:first-child .actions'));
const reader=createReader({container:el.messages,onSeek:(message,index)=>{handsfree.stop();cancelAudio();readMessage(message,index);}});
composer.after(el.status);
let autoplay=false,eventCursor=null,polling=false;
const autoplayQueue=[];
const spokenIds=new Set();
const unsavedReads=new Set();
async function saveReads(){for(const id of unsavedReads){const result=await api('/api/read',{id});if(result.error){status('Read flag could not be saved; retrying.');break;}unsavedReads.delete(id);}}
function spokenText(text){return text.replace(/^\[[^\]\n]+\][^\n]*(?:\n|$)/,'').trim();}
async function queueUnread(){
  await saveReads();
  const recipient=el.agent.value;
  const result=await api('/api/unread?agent='+encodeURIComponent(recipient));
  if(recipient!==el.agent.value)return;
  if(result.error){status(result.error);return;}
  const unread=new Set(result.data.filter(m=>m.agent===el.agent.value).map(m=>m.id));
  for(let i=autoplayQueue.length-1;i>=0;i--)if(!unread.has(autoplayQueue[i].id)&&!(i===0&&autoplaySpeaking))autoplayQueue.splice(i,1);
  for(const message of result.data)if(message.agent===el.agent.value&&!spokenIds.has(message.id)&&!autoplayQueue.some(m=>m.id===message.id))autoplayQueue.push(message);
}
let autoplaySpeaking=false;
async function playQueued(){
  if(!autoplay||autoplaySpeaking||recording||busy||document.hidden||!autoplayQueue.length||speaking||!['off','listening'].includes(handsfree.state))return;
  autoplaySpeaking=true;
  const message=autoplayQueue[0];
  const token=generation;
  if(message.agent!==el.agent.value){autoplayQueue.shift();autoplaySpeaking=false;return;}
  if(!messages.some(m=>m.id===message.id))await load(message.id);
  if(token!==generation)return;
  const finished=()=>{autoplayQueue.shift();autoplaySpeaking=false;playQueued();};
  const text=spokenText(message.text);
  if(!text){finished();return;}
  readMessage(message,0,finished,()=>{autoplaySpeaking=false;autoplay=false;autoButton.textContent='Auto-play: off';autoButton.setAttribute('aria-pressed','false');});
}
function readMessage(message,start=0,done,failed,completeRead=start===0){
  const parts=splitSentences(spokenText(message.text));
  function next(index){if(index>=parts.length){readingPosition=null;rememberPosition(null);reader.clear();if(completeRead&&Number.isSafeInteger(message.id)){spokenIds.add(message.id);unsavedReads.add(message.id);saveReads();}done?.();return;}readingPosition={message,index,done,failed,completeRead};pauseButton.textContent='Pause';rememberPosition({agent:el.agent.value,id:message.id,index,completeRead});speak(parts[index],()=>next(index+1),failed,()=>reader.highlight(message.id,index));const following=autoplay?autoplayQueue.filter(m=>m.id!==message.id&&m.agent===el.agent.value).flatMap(m=>splitSentences(spokenText(m.text))):[];audio.prefetch([...parts.slice(index+1),...following].flatMap(part=>part.match(/[\s\S]{1,1800}/g)||[]));}
  next(start);
}
const autoButton=document.getElementById('auto');
// 🧑 "A button that automatically plays everything new received" ... "Should be a toggle"
autoButton.onclick=async()=>{if(autoplay){autoplay=false;handsfree.stop();cancelAudio();autoplayQueue.length=0;}else{cancelAudio();autoplay=true;audio.unlock();await queueUnread();const saved=pausedPosition;if(saved?.agent===el.agent.value){await load(saved.id);const message=messages.find(m=>m.id===saved.id);if(message){autoplaySpeaking=true;readMessage(message,saved.index,()=>{autoplaySpeaking=false;queueUnread().then(playQueued);},()=>{autoplaySpeaking=false;},saved.completeRead);}else{autoplay=false;status('Saved message could not be loaded. Tap a message to choose a new position.');}}else playQueued();}autoButton.textContent='Auto-play: '+(autoplay?'on':'off');autoButton.setAttribute('aria-pressed',String(autoplay));};
// 🧑 "allow agents to produce some fixed texts that would make the backend do the switch to another agent specified"
async function pollEvents(){
  if(!ready||polling||busy||recording||document.hidden||!['off','listening'].includes(handsfree.state))return;
  polling=true;
  try{
    const result=await api('/api/events'+(eventCursor===null?'':'?after='+eventCursor));
    if(result.error){status(result.error);return;}
    if(busy||recording||document.hidden)return;
    if(result.data.conversations){
      const selected=el.agent.value;
      const next=result.data.conversations;
      if(JSON.stringify(next)!==JSON.stringify(conversations)){
        conversations=next;
        el.agent.replaceChildren(...conversations.map(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=c.name;return option;}));
        if(conversations.some(c=>c.id===selected))el.agent.value=selected;
        else{const draft=drafts[el.agent.value];el.draft.value=draft?.text||'';pending=draft?.pending||null;await load();}
      }
    }
    if(eventCursor===null){eventCursor=result.data.cursor;return;}
    let completed=true;
    for(const event of result.data.events){
      if(busy||recording||document.hidden){completed=false;break;}
      if(event.notice)status(event.notice);
      if(event.switchTo){
        saveDraft();el.agent.value=event.switchTo;
        const draft=drafts[event.switchTo];pending=draft?.pending||null;el.draft.value=draft?.text||'';saveDraft();
        await load();
        const announcement='Switched to '+conversations.find(c=>c.id===event.switchTo).name+'.';
        status(announcement+(event.notice?' '+event.notice:''));
        if(!autoplay)speak(announcement);
      }else if(event.agent===el.agent.value)await load();
      eventCursor=event.id;
    }
    if(completed)eventCursor=result.data.cursor;
  }finally{if(autoplay)await queueUnread();polling=false;playQueued();}
}
function controls(){el.dictate.disabled=!ready||!Recognition||busy||recording||!!pending||finishingSend;el.choose.disabled=!ready||!Recognition||busy||recording;el.stop.disabled=!recording||!captureReady;finishSend.disabled=!recording||!captureReady||finishingSend;el.review.disabled=!ready||busy||recording||!el.draft.value.trim()||finishingSend;el.send.disabled=!ready||busy||recording||!el.draft.value.trim()||finishingSend;el.agent.disabled=!ready||busy||finishingSend;el.draft.disabled=!ready||busy||recording||!!pending||finishingSend;el.listen.disabled=!ready||loading;cancelQueued.hidden=!pending;cancelQueued.disabled=busy;}
function cancelAudio(keepPrepared=true){generation++;promptDone?.();promptDone=null;recording=false;captureReady=false;autoplaySpeaking=false;speaking=false;pauseButton.textContent='Play';readingPosition=null;audio.stop(keepPrepared);reader.clear();controls();}
function speak(text,done,failed,started){speaking=true;const parts=splitSentences(text).flatMap(part=>part.match(/[\s\S]{1,1800}/g)||[]);function next(index){if(index===parts.length){speaking=false;done?.();return;}audio.speak(parts[index],()=>next(index+1),()=>{speaking=false;failed?.();},started);}next(0);}
function startRecognition(confirm=false){cancelAudio();if(!Recognition)return;const token=generation,recipient=el.agent.value,base=el.draft.value.trim();audioDraft={id:submissionId(),agent:recipient,prefix:base,confirm};recording=true;controls();audio.record(async(result,meta)=>{if(confirm){if(token!==generation||recipient!==el.agent.value)return;await outbox.remove(result.id);const command=result.text.toLowerCase().replace(/[.!?,]/g,'').trim();if(command==='send')send();else status(command==='cancel'?'Draft kept. Nothing sent.':'Nothing sent. Say exactly “send”, or use the button.');}else{if(!storeTranscript(result.id,meta.agent,result.text,meta.prefix))throw new Error('Draft storage failed; recording retained.');await outbox.remove(result.id);controls();status('Transcript added to '+meta.agent+'.');}},()=>{controls();},{...audioDraft},()=>{recording=false;captureReady=false;controls();}).then(()=>{if(token===generation&&recording){captureReady=true;controls();}});}
function persistDrafts(){try{localStorage.setItem('voice-draft:'+storageScope,JSON.stringify({agent:el.agent.value,drafts,appliedRecordings:[...appliedRecordings]}));return true;}catch{status('Draft storage unavailable. Keep this page open until sending is resolved.');return false;}}
function saveDraft(){drafts[el.agent.value]={text:el.draft.value,pending};return persistDrafts();}
function storeTranscript(id,agent,text,prefix=''){
  if(appliedRecordings.has(id))return true;
  const previous=drafts[agent];
  if(previous?.pending){status('Recording saved until the queued message is resolved.');return false;}
  drafts[agent]={text:[previous?.text||prefix,text].filter(Boolean).join(' '),pending:previous?.pending||null};appliedRecordings.add(id);
  if(!persistDrafts()){drafts[agent]=previous;appliedRecordings.delete(id);return false;}
  if(el.agent.value===agent){el.draft.value=drafts[agent].text;pending=drafts[agent].pending;}
  return true;
}
async function api(path,body){try{const result=await resilientFetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined},{onState:networkState});if(result.error)return{error:result.error};const response=result.response,data=await response.json();return response.ok?{data}:{error:data.error||'Request failed'};}catch(error){return{error:path+': '+error.message};}}
function render(){reader.render(messages.map((message,index)=>({...message,id:message.id??'history-'+index,text:message.sender==='agent'?spokenText(message.text):message.text})),conversations.find(c=>c.id===el.agent.value)?.name);}
async function flushOutbox(){
  if(!ready||!outbox||flushing||busy||recording||handsfree.state!=='off'||document.hidden)return;
  flushing=true;
  busy=true;controls();
  try{
    const items=await outbox.list();if(items.error){status(items.error);return;}
    for(const item of items.data){
      if(activeRecordings.has(item.id)||dictationClips.some(clip=>clip.metadata.id===item.id))continue;
      if(appliedRecordings.has(item.id)){await outbox.remove(item.id);continue;}
      if(recording||handsfree.state!=='off')break;
      if(!conversations.some(c=>c.id===item.agent)){status('Saved item awaits its original conversation: '+item.agent);continue;}
      if(item.kind==='audio'&&drafts[item.agent]?.pending)continue;
      if(item.kind==='send'){
        const result=await api('/api/send',item.payload);if(result.error){status(result.error);break;}
        await outbox.remove(item.id);
        if(drafts[item.agent]?.pending?.id===item.id){drafts[item.agent]={text:'',pending:null};if(el.agent.value===item.agent){pending=null;el.draft.value='';}saveDraft();}
        status('Queued message delivered to '+item.agent+'.');
      }else{
        const result=await resilientFetch('/api/stt',{method:'POST',body:item.blob},{retries:0,timeoutMs:10000,onState:networkState});
        if(result.error){status(result.error);break;}const data=await result.response.json();if(!result.response.ok){status(data.error);break;}
        if(!item.confirmation&&!item.command){
          const text=item.handsfree?data.text.replace(/\bresume[\s.!?,;:]+auto[\s-]*play\b[\s.!?,;:]*$/i,'').trim():data.text;
          if(!storeTranscript(item.id,item.agent,text,item.prefix))break;
          status('Recovered recording in '+item.agent+'. Review before sending.');
        }else status('Recovered voice command was not executed. Use the controls to continue.');
        await outbox.remove(item.id);
      }
    }
    controls();
  }finally{flushing=false;busy=false;controls();}
}
async function load(anchor=readingPosition?.message.id){const recipient=el.agent.value;loaded=false;loading=true;controls();const result=await api('/api/messages?agent='+encodeURIComponent(recipient)+(Number.isSafeInteger(anchor)?'&anchor='+anchor:''));if(recipient!==el.agent.value)return;loading=false;if(result.error){status(result.error);controls();return;}messages=result.data;loaded=true;render();controls();}
// 🧑 "talk to the interface to send messages ... which agent I am talking to"
async function send(preserveAudio=false){if(!ready||busy||!el.draft.value.trim())return false;if(!preserveAudio)cancelAudio();const agent=el.agent.value,text=el.draft.value.trim();if(!pending||pending.agent!==agent||pending.text!==text)pending={id:submissionId(),agent,text};saveDraft();busy=true;controls();const submission={...pending};if(!outbox){busy=false;controls();status('Offline storage unavailable. Nothing sent.');return false;}const existing=await outbox.get(submission.id);if(!existing.data){const saved=await outbox.add({id:submission.id,agent,kind:'send',payload:submission});if(saved.error){busy=false;controls();status(saved.error);return false;}}const result=await api('/api/send',submission);busy=false;if(result.error){status(result.error);controls();return false;}await outbox.remove(submission.id);pending=null;el.draft.value='';saveDraft();status((mock?'Mock message':'Message')+' delivered to '+conversations.find(c=>c.id===agent).name+'.');await load();controls();return true;}
el.dictate.onclick=()=>{handsfree.stop();startRecognition();};
el.stop.onclick=()=>audio.finish();
// 🧑 "after finishing dictating there should be an option to directly send so I don't need to click two things."
finishSend.onclick=async()=>{
  if(!recording||!captureReady||finishingSend)return;
  const recipient=audioDraft.agent;finishingSend=true;audio.finish();controls();
  try{
    const deadline=Date.now()+20000;
    do{await new Promise(resolve=>setTimeout(resolve,50));if(dictationClips.some(clip=>clip.state==='error')){status('Transcription failed. Retry the clip, then send your draft.');return;}}while((recording||dictationClips.length)&&Date.now()<deadline);
    if(recording||dictationClips.length){status('Transcription is still pending. Your recording is saved; send after it finishes.');return;}
    if(recipient!==el.agent.value){status('Draft kept for '+recipient+'. Return there to send.');return;}
    await send();
  }finally{finishingSend=false;controls();}
};
el.quiet.onclick=()=>{handsfree.stop();cancelAudio(false);autoplay=false;autoButton.textContent='Auto-play: off';autoButton.setAttribute('aria-pressed','false');autoplayQueue.length=0;status('Audio stopped.');};
el.review.remove();
el.send.onclick=()=>{handsfree.stop();send();};
el.listen.onclick=async()=>{cancelAudio();const token=generation;await load();if(token!==generation||!loaded)return;const replies=messages.filter(m=>m.sender==='agent');function next(index){if(index<replies.length)readMessage(replies[index],0,()=>next(index+1));}next(0);};
el.draft.oninput=()=>{cancelAudio();pending=null;saveDraft();controls();};
el.agent.onchange=()=>{handsfree.stop();cancelAudio(false);const draft=drafts[el.agent.value];pending=draft?.pending||null;el.draft.value=draft?.text||'';saveDraft();status('Talking to '+conversations.find(c=>c.id===el.agent.value).name+'.');load();controls();};
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveDraft();cancelAudio();}});
document.querySelector('.note').textContent='Tap Dictate, then Finish. Review your draft and tap Send. Keep the page open for playback.';
controls();
const mode=await api('/api/mode');
if(mode.data){storageScope=mode.data.scope+':'+mode.data.mock;const opened=await openDurableQueue(storageScope);outbox=opened.data;if(opened.error)status(opened.error);}
if(!window.isSecureContext)document.querySelector('.note').textContent='IP preview: use your keyboard microphone for dictation. Browser microphone and spoken confirmation are unavailable here. Mock messages only.';
if(mode.data){mock=mode.data.mock;document.getElementById('mode').textContent=mock?'Mock conversations · nothing goes to Zulip':'Personal client · sends as your account';el.send.textContent=mock?'Send mock message':'Send message';document.title=mock?'Voice':'Voice';}
const result=mode.error?mode:await api('/api/conversations');
if(result.error){status(result.error);el.agent.disabled=true;}
else{
  conversations=result.data;
  ready=true;
  for(const item of conversations){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;el.agent.append(option);}
  try{const saved=JSON.parse(localStorage.getItem('voice-draft:'+storageScope)||sessionStorage.getItem('voice-draft:'+mock));if(saved&&conversations.some(c=>c.id===saved.agent)){drafts=saved.drafts||{};for(const id of saved.appliedRecordings||[])appliedRecordings.add(id);el.agent.value=saved.agent;el.draft.value=drafts[saved.agent]?.text||'';pending=drafts[saved.agent]?.pending||null;}}catch{}
  await load();
}
if(!Recognition)status('Microphone capture is unavailable in this browser. You can use keyboard dictation.');
controls();
await pollEvents();
compactControls=installCompactControls({composer,draft:el.draft,dictate:el.dictate});
try{const saved=JSON.parse(localStorage.getItem('voice-position:'+storageScope));if(saved&&conversations.some(c=>c.id===saved.agent)){pausedPosition=saved;el.agent.value=saved.agent;el.draft.value=drafts[saved.agent]?.text||'';pending=drafts[saved.agent]?.pending||null;await load(saved.id);pauseButton.textContent='Play';}}catch{}
setInterval(pollEvents,window.voiceBrowserOnly?5000:1500);
setInterval(flushOutbox,10000);
window.addEventListener('online',()=>{if(!ready)location.reload();else{flushOutbox();pollEvents();}});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{document.body.style.height=window.visualViewport.height+'px';});
</script>
</html>
